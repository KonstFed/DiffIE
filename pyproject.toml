[project]
name = "diffopenie"
version = "0.1.0"
description = "DiffIE: Diffusion-based Open Information Extraction"
authors = [
    {name = "KonstFed", email = "konstfed12@gmail.com"}
]
readme = "README.md"
requires-python = "<3.13,>=3.12"
dependencies = [
    "zenodo-get (>=2.0.0,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "datasets (>=3.6.0,<4.0.0)",
    "torch>=2.9.0,<3.0.0",
    "matplotlib (>=3.10.7,<4.0.0)",
    "transformers (>=4.57.1,<5.0.0)",
    "protobuf (>=6.33.0,<7.0.0)",
    "plotly>=6.4.0",
    "pytest>=9.0.2",
    "scikit-learn>=1.0.0",
    "pydantic>=2.12.5",
    "torchmetrics>=1.0.0",
    "streamlit>=1.55.0",
    "sentencepiece>=0.2.1",
    "seaborn>=0.13.2",
    # benchmarks/CaRB/carb.py runtime
    "docopt>=0.6.2",
    "nltk>=3.8",
    "ipdb>=0.13",
]

[tool.poetry]
packages = [{include = "diffopenie", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = [
  "E203",
  "E266",
]

[tool.ruff.format]
quote-style = "double"
