# MC-dropout BERT tagger baseline (non-diffusion) for the '250' data
# variant. Generated by scripts/make_tagger_configs.py from
# configs/lsoie_ex_250/lsoie_ex_250_config.yaml — trainer/data reused verbatim, only the
# model block swapped. Isolates diffusion vs. stochastic-tagging+clustering.
trainer:
  type: discrete_trainer
  device: null
  learning_rate: 2e-4
  encoder_lr: 5e-5
  weight_decay: 0.01
  label_smoothing: 0.0
  warmup_steps: 500
  background_drop_prob: 0.0
  class_weights:
  - 0.7
  - 1.0
  - 1.0
  - 1.0
  use_amp: true
  carb_gold_path: benchmarks/CaRB/data/gold/dev.tsv
  carb_sentences_path: benchmarks/CaRB/data/dev.txt
model:
  type: mc_dropout_tagger
  encoder:
    model_name: bert-base-uncased
    freeze: false
    num_frozen_layers: 4
  dropout: 0.3
  temperature: 1.0
  argmax: true
  inference_chunk_size: 128
  extractor:
    type: lenient_frequency
    k: 512
    topk: 4
    threshold: 0.9
data:
  train_dataset:
    type: cached
    datasets:
    - type: cycleoie
      path: dataset/cycleoie/lsoie-g-examples.tsv
      tokenizer_name: bert-base-uncased
      min_success_pct: 100.0
      max_rows: 250
      max_rows_seed: 0
    encoder: null
    batch_size: 32
  batch_size: 32
  num_workers: 4
  pad_token_id: 0
num_epochs: 12
log_interval: 100
save_path: configs/lsoie_ex_tagger_250
save_interval: 12
val_full_interval: 6
val_metrics_on_train: false
train_val_batches: 10
val_carb: false
val_lsoie: false
